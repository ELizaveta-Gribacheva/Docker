  permissions:
    contents: read       
    packages: write     
  
  name: CI with Docker
  
  on:
    push:
      branches:
        - main
        - feature/docker-setup
    pull_request:
      branches:
        - main
        - feature/docker-setup
  
  jobs:
    docker-ci:
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
  
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
  
        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ghcr.io/elizaveta-gribacheva/brackets-checker:latest

  
        - name: Pull image and run tests
          run: |
            docker pull ghcr.io/elizaveta-gribacheva/brackets-checker:latest
            docker run --rm ghcr.io/elizaveta-gribacheva/brackets-checker:latest

  